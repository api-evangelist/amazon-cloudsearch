naftiko: "1.0.0-alpha1"

info:
  label: "Amazon CloudSearch"
  description: "API for creating and managing CloudSearch domains, uploading documents, configuring search fields and suggesters, and executing search queries."
  tags:
    - Amazon Web Services
    - Amazon CloudSearch
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - type: http
      namespace: cloudsearch
      baseUri: https://cloudsearch.us-east-1.amazonaws.com
      description: "Amazon CloudSearch API."
      authentication:
        type: apikey
        key: Authorization
        value: "{{AWS_ACCESS_KEY_ID}}"
        placement: header
      resources: []

  exposes:
    - type: rest
      port: 8100
      namespace: cloudsearch-rest
      resources: []

    - type: mcp
      port: 9100
      namespace: cloudsearch-mcp
      transport: http
      tools: []
