naftiko: "1.0.0-alpha1"

info:
  label: "Amazon CloudSearch Search Domain Management"
  description: "Workflow for search domain management using Amazon CloudSearch for Application Developer personas."
  tags:
    - Amazon Web Services
    - Amazon CloudSearch
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
      AWS_REGION: AWS_REGION

capability:
  consumes:
    - import: cloudsearch
      location: ./shared/cloudsearch.yaml

  exposes:
    - type: rest
      port: 8080
      namespace: cloudsearch-workflow-api
      description: "Unified REST API for Amazon CloudSearch search domain management."
      resources: []

    - type: mcp
      port: 9090
      namespace: cloudsearch-workflow-mcp
      transport: http
      description: "MCP server for AI-assisted Amazon CloudSearch search domain management."
      tools: []
