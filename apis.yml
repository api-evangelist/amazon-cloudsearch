name: Amazon CloudSearch API
description: Amazon CloudSearch is a managed service in the AWS Cloud that makes it simple and cost-effective to set up, manage, and scale a search solution for your website or application, supporting full-text search, faceting, highlighting, autocomplete, and geospatial search.
image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
url: https://aws.amazon.com/cloudsearch/
created: '2024-01-15'
modified: '2026-03-13'
apis:
- name: Amazon CloudSearch API
  description: >-
    API for creating, configuring, and managing search domains. Supports
    defining index fields, configuring scaling options, managing access
    policies, uploading documents, and running search queries with
    full-text search, faceting, filtering, and highlighting capabilities.
  image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
